<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EFE6">
<title>소웰 수업일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brown:#2C2620; --terra:#E8601A; --terra-d:#C94F12; --cream:#F5EFE6;
    --card:#FFFDF9; --line:#E6DCCD; --muted:#7D7166; --ok:#3F7D4E; --err:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--cream);color:var(--brown);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.55}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
  .tag{font-size:12px;color:var(--terra);border:1px solid var(--terra);border-radius:99px;padding:1px 8px}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
  .card h2{font-size:15px;margin:0 0 10px;font-weight:700}
  details>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:'▾';float:right;color:var(--muted)}
  details[open]>summary::after{content:'▴'}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,textarea{width:100%;font:inherit;font-size:16px;color:var(--brown);background:#fff;
                 border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--terra);outline-offset:-1px;border-color:transparent}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:500;font-size:15px;
       border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--brown);color:#fff}
  .btn.ghost{background:transparent;color:var(--brown);border:1px solid var(--line)}
  .btn.terra{background:var(--terra)}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .row .btn{flex:1}
  .recbox{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
  .rec{width:132px;height:132px;border-radius:50%;border:0;background:var(--terra);color:#fff;font:inherit;
       font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(232,96,26,.28);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;-webkit-tap-highlight-color:transparent}
  .rec .ico{font-size:34px;line-height:1}
  .rec.on{background:var(--brown);box-shadow:0 0 0 0 rgba(232,96,26,.55);animation:pulse 1.4s infinite}
  .rec:disabled{opacity:.5}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,96,26,.5)}70%{box-shadow:0 0 0 22px rgba(232,96,26,0)}100%{box-shadow:0 0 0 0 rgba(232,96,26,0)}}
  .timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;margin-top:14px}
  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
  .status{margin-top:12px;font-size:14px;text-align:center;min-height:22px}
  .status.err{color:var(--err)}
  .status.ok{color:var(--ok)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--terra);
        border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #result{min-height:280px;white-space:pre-wrap}
  .debug{font-size:11px;color:var(--muted);margin-top:8px;word-break:break-all}
  .hidden{display:none !important}
  .note{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌿 소웰 수업일지</h1>
    <span class="tag">테스트</span>
  </header>
  <p class="sub">수업 끝나고 말로 남기면, 회원에게 보낼 일지로 정리해 드려요.</p>

  <!-- 설정 -->
  <details class="card" id="settingsBox">
    <summary>⚙️ 설정</summary>
    <label for="sKey">Gemini API 키</label>
    <input id="sKey" type="password" autocomplete="off" placeholder="키를 붙여넣으세요">
    <p class="note">키는 이 폰(브라우저)에만 저장되고, 페이지 코드에는 들어가지 않아요.</p>
    <label for="sModel">AI 모델</label>
    <input id="sModel" type="text" autocomplete="off">
    <label for="sTrainer">담당 선생님 이름</label>
    <input id="sTrainer" type="text" placeholder="예: 권경준">
    <label for="sCenter">센터명</label>
    <input id="sCenter" type="text">
    <label for="sClosing">마무리 문구</label>
    <input id="sClosing" type="text">
    <div class="row"><button class="btn" id="saveBtn">저장</button></div>
  </details>

  <!-- 녹음 -->
  <section class="card">
    <div class="recbox">
      <button class="rec" id="recBtn" aria-label="녹음 시작">
        <span class="ico">🎙️</span><span id="recLabel">녹음 시작</span>
      </button>
      <div class="timer" id="timer">0:00</div>
      <div class="hint" id="hint">예) "데드리프트 삼십키로 열다섯개 삼세트, 왼쪽 골반이 안정됨, 숙제는 오픈북 열개 삼세트 매일"</div>
    </div>
    <div class="status" id="status"></div>

    <details style="margin-top:10px">
      <summary style="font-size:14px">⌨️ 말 대신 글로 테스트</summary>
      <textarea id="textIn" placeholder="여기에 메모를 적고 [정리하기]를 누르세요" style="margin-top:10px"></textarea>
      <div class="row"><button class="btn" id="textBtn">정리하기</button></div>
    </details>
  </section>

  <!-- 결과 -->
  <section class="card hidden" id="resultBox">
    <h2>✅ 정리된 수업일지</h2>
    <textarea id="result" aria-label="정리된 수업일지"></textarea>
    <p class="note">보내기 전에 직접 고칠 수 있어요.</p>
    <div class="row">
      <button class="btn terra" id="shareBtn">공유하기</button>
      <button class="btn ghost" id="copyBtn">복사하기</button>
    </div>
  </section>

  <section class="card hidden" id="transBox">
    <details>
      <summary>📝 받아쓴 원문 보기 · 고치기</summary>
      <textarea id="transcript" style="margin-top:10px"></textarea>
      <p class="note">잘못 알아들은 부분을 고치고 다시 정리할 수 있어요.</p>
      <div class="row"><button class="btn ghost" id="redoBtn">이 내용으로 다시 정리</button></div>
    </details>
    <div class="debug" id="debug"></div>
  </section>
</div>

<!-- ───────── 핵심 로직 (화면과 분리) ───────── -->
<script id="core">
var SJ = (function () {
  var DEFAULTS = {
    model: 'gemini-3.8-flash',
    trainer: '',
    center: '소웰 웰니스 PT 반포',
    closing: '🌿 오늘의 움직임이 내일의 일상을 바꿉니다.'
  };

  var SYSTEM = [
    '당신은 1:1 PT 스튜디오의 수업일지 정리 도우미입니다.',
    '트레이너가 수업 직후 말(또는 글)로 남긴 메모를, 회원에게 보낼 수업일지 항목으로 정리합니다.',
    '',
    '[규칙]',
    '1. 트레이너가 말한 내용만 씁니다. 말하지 않은 운동·무게·횟수·평가·조언은 절대 추가하지 않습니다. 해당 내용이 없으면 그 배열은 빈 배열로 둡니다.',
    '2. 숫자는 아라비아 숫자로 바꿉니다. 예: 삼십키로→30kg, 열다섯개/열다섯번→15회, 삼세트→3세트, 십초→10초, 일분→1분, 이십오키로→25kg.',
    '3. 운동의 detail은 "무게 × 횟수(또는 시간) × 세트" 순서로 씁니다. 예: "30kg × 15회 × 3세트", "10회 × 4세트", "10초 × 3세트". 말한 항목만 넣고, 한쪽씩이라고 했으면 끝에 "(한쪽씩)"을 붙입니다.',
    '4. 운동 이름은 표준 한국어 표기와 띄어쓰기로 정리합니다. 예: 불가리안스플릿스쿼트→불가리안 스플릿 스쿼트, 루마니안데드→루마니안 데드리프트. 확실하지 않으면 들린 그대로 씁니다.',
    '5. improvements / homework / next_plan / notes는 회원에게 보내는 문장입니다. 부드러운 존댓말(~했어요, ~해주세요)로 다듬되, 의미를 바꾸거나 과장하지 않습니다. 예: "패턴이 좋아짐"→"움직임 패턴이 좋아졌어요".',
    '6. homework 안의 운동도 3번 형식을 씁니다. 예: "오픈북 10회 × 3세트, 매일 해주세요".',
    '7. notes에는 통증, 컨디션, 주의사항처럼 다른 칸에 맞지 않는 내용만 넣습니다.',
    '8. transcript에는 음성이면 들린 그대로 받아쓴 한국어 원문을, 글이면 입력된 글을 그대로 넣습니다.'
  ].join('\n');

  var SCHEMA = {
    type: 'OBJECT',
    properties: {
      transcript:   { type: 'STRING' },
      exercises:    { type: 'ARRAY', items: { type: 'OBJECT', properties: {
                        name: { type: 'STRING' }, detail: { type: 'STRING' } }, required: ['name', 'detail'] } },
      improvements: { type: 'ARRAY', items: { type: 'STRING' } },
      homework:     { type: 'ARRAY', items: { type: 'STRING' } },
      next_plan:    { type: 'ARRAY', items: { type: 'STRING' } },
      notes:        { type: 'ARRAY', items: { type: 'STRING' } }
    },
    required: ['transcript', 'exercises', 'improvements', 'homework', 'next_plan', 'notes'],
    propertyOrdering: ['transcript', 'exercises', 'improvements', 'homework', 'next_plan', 'notes']
  };

  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function dateLabel(d) {
    d = d || new Date();
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
  }

  function clean(arr) {
    return (arr || []).map(function (s) { return String(s || '').trim(); }).filter(Boolean);
  }

  function render(data, opt, date) {
    opt = opt || {};
    var L = ['📋 오늘의 수업일지 · ' + dateLabel(date)];
    var ex = (data.exercises || []).filter(function (e) { return e && String(e.name || '').trim(); });
    if (ex.length) {
      L.push('', '💪 오늘 한 운동');
      ex.forEach(function (e) {
        var det = String(e.detail || '').trim();
        L.push('- ' + String(e.name).trim() + (det ? ' ' + det : ''));
      });
    }
    function section(title, items) {
      items = clean(items);
      if (!items.length) return;
      L.push('', title);
      if (items.length === 1) L.push(items[0]);
      else items.forEach(function (s) { L.push('- ' + s); });
    }
    section('👍 좋아진 점', data.improvements);
    section('🏠 숙제', data.homework);
    section('➡️ 다음 수업', data.next_plan);
    section('📝 참고', data.notes);

    var closing = String(opt.closing || '').trim();
    var center = String(opt.center || '').trim();
    var trainer = String(opt.trainer || '').trim();
    var sign = center && trainer ? center + ' | 담당 ' + trainer : (center || (trainer ? '담당 ' + trainer : ''));
    if (closing || sign) {
      L.push('');
      if (closing) L.push(closing);
      if (sign) L.push(sign);
    }
    return L.join('\n');
  }

  /** Float32 PCM → 16bit mono WAV (Uint8Array) */
  function encodeWav(samples, rate) {
    var n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    for (var i = 0, o = 44; i < n; i++, o += 2) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Uint8Array(buf);
  }

  function bytesToB64(bytes) {
    var bin = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  }

  function buildRequest(parts) {
    return {
      systemInstruction: { parts: [{ text: SYSTEM }] },
      contents: [{ role: 'user', parts: parts }],
      generationConfig: { temperature: 0.2, responseMimeType: 'application/json', responseSchema: SCHEMA }
    };
  }

  function friendlyError(status, body) {
    var msg = (body && body.error && body.error.message) || '';
    var head;
    if (status === 400 && /api key/i.test(msg)) head = 'API 키가 올바르지 않아요. [설정]에서 키를 다시 확인해 주세요.';
    else if (status === 400) head = '요청 형식 문제예요.';
    else if (status === 401 || status === 403) head = 'API 키 권한 문제예요. 키가 맞는지, 사용 제한이 걸려 있지 않은지 확인해 주세요.';
    else if (status === 404) head = 'AI 모델 이름을 찾을 수 없어요. [설정]의 모델 이름을 확인해 주세요.';
    else if (status === 429) head = '사용 한도를 넘었어요. 잠시 후 다시 시도하거나, 결제를 연결해 주세요.';
    else if (status >= 500) head = 'AI 서버가 잠시 불안정해요. 다시 시도해 주세요.';
    else head = '오류가 났어요 (' + status + ').';
    return head + (msg ? '\n(' + msg + ')' : '');
  }

  function parseResponse(body) {
    var c = body && body.candidates && body.candidates[0];
    var text = c && c.content && c.content.parts
      ? c.content.parts.filter(function (p) { return !p.thought; }).map(function (p) { return p.text || ''; }).join('')
      : '';
    if (!text) {
      var why = (body && body.promptFeedback && body.promptFeedback.blockReason) || (c && c.finishReason) || '알 수 없음';
      throw new Error('AI 응답이 비어 있어요. (' + why + ')');
    }
    text = text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    return JSON.parse(text);
  }

  return { DEFAULTS: DEFAULTS, SYSTEM: SYSTEM, SCHEMA: SCHEMA, render: render, encodeWav: encodeWav,
           bytesToB64: bytesToB64, buildRequest: buildRequest, friendlyError: friendlyError,
           parseResponse: parseResponse, dateLabel: dateLabel };
})();
</script>

<!-- ───────── 화면 동작 ───────── -->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MAX_SEC = 180;

  var store = {
    get: function (k) { try { return localStorage.getItem('sj_' + k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('sj_' + k, v); } catch (e) {} }
  };
  var mem = {};
  function cfg(k) {
    var v = store.get(k);
    if (v === null || v === undefined) v = mem[k];
    if (v === null || v === undefined || v === '') v = k === 'key' ? '' : SJ.DEFAULTS[k];
    return v || '';
  }

  // ── 설정 ──
  function loadSettings() {
    $('sKey').value = cfg('key');
    $('sModel').value = cfg('model');
    $('sTrainer').value = cfg('trainer');
    $('sCenter').value = cfg('center');
    $('sClosing').value = cfg('closing');
    if (!cfg('key')) $('settingsBox').open = true;
  }
  $('saveBtn').onclick = function () {
    ['key', 'model', 'trainer', 'center', 'closing'].forEach(function (k) {
      var id = 's' + k.charAt(0).toUpperCase() + k.slice(1);
      var v = $(id).value.trim();
      mem[k] = v; store.set(k, v);
    });
    $('settingsBox').open = false;
    setStatus('설정을 저장했어요.', 'ok');
    if (lastData) showResult(lastData);
  };

  // ── 상태 표시 ──
  function setStatus(msg, kind, busy) {
    var el = $('status');
    el.className = 'status' + (kind ? ' ' + kind : '');
    el.innerHTML = '';
    if (busy) { var s = document.createElement('span'); s.className = 'spin'; el.appendChild(s); }
    el.appendChild(document.createTextNode(msg || ''));
    el.style.whiteSpace = 'pre-line';
  }
  function setBusy(b) {
    $('recBtn').disabled = b; $('textBtn').disabled = b; $('redoBtn').disabled = b;
  }

  // ── 녹음 ──
  var rec = null, stream = null, chunks = [], t0 = 0, tick = null, recMime = '';
  function fmtTime(sec) { return Math.floor(sec / 60) + ':' + ('0' + Math.floor(sec % 60)).slice(-2); }

  function pickMime() {
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var list = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/aac'];
    for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }

  async function startRec() {
    if (!cfg('key')) { $('settingsBox').open = true; setStatus('먼저 [설정]에 API 키를 넣어 주세요.', 'err'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      setStatus('이 브라우저에서는 녹음이 안 돼요. 아이폰은 사파리, 안드로이드는 크롬 최신 버전으로 열어 주세요.', 'err');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      setStatus('마이크 권한이 필요해요. 주소창 옆 설정에서 마이크를 "허용"으로 바꿔 주세요.\n(' + e.name + ')', 'err');
      return;
    }
    recMime = pickMime();
    try { rec = recMime ? new MediaRecorder(stream, { mimeType: recMime }) : new MediaRecorder(stream); }
    catch (e) { rec = new MediaRecorder(stream); }
    chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = onStop;
    rec.start(1000);
    t0 = Date.now();
    $('recBtn').classList.add('on');
    $('recLabel').textContent = '멈추고 정리';
    $('timer').textContent = '0:00';
    setStatus('듣고 있어요… 다 말하면 버튼을 다시 눌러 주세요.');
    tick = setInterval(function () {
      var s = (Date.now() - t0) / 1000;
      $('timer').textContent = fmtTime(s);
      if (s >= MAX_SEC) stopRec();
    }, 250);
  }

  function stopRec() {
    if (!rec || rec.state === 'inactive') return;
    clearInterval(tick);
    rec.stop();
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    $('recBtn').classList.remove('on');
    $('recLabel').textContent = '녹음 시작';
  }

  async function blobToWavB64(blob) {
    var buf = await blob.arrayBuffer();
    var AC = window.AudioContext || window.webkitAudioContext;
    var ac = new AC();
    var decoded = await new Promise(function (res, rej) {
      var p = ac.decodeAudioData(buf, res, rej);
      if (p && p.then) p.then(res, rej);
    });
    try { ac.close(); } catch (e) {}
    var RATE = 16000;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var off = new OAC(1, Math.max(1, Math.ceil(decoded.duration * RATE)), RATE);
    var src = off.createBufferSource();
    src.buffer = decoded; src.connect(off.destination); src.start(0);
    var rendered = await new Promise(function (res, rej) {
      off.oncomplete = function (e) { res(e.renderedBuffer); };
      var p = off.startRendering();
      if (p && p.then) p.then(res, rej);
    });
    return { b64: SJ.bytesToB64(SJ.encodeWav(rendered.getChannelData(0), RATE)), sec: decoded.duration };
  }

  async function onStop() {
    var secs = (Date.now() - t0) / 1000;
    if (secs < 1.5 || !chunks.length) { setStatus('녹음이 너무 짧아요. 다시 해주세요.', 'err'); return; }
    var blob = new Blob(chunks, { type: rec.mimeType || recMime || 'audio/webm' });
    setBusy(true);
    setStatus('음성 파일 준비 중…', '', true);
    var audio;
    try { audio = await blobToWavB64(blob); }
    catch (e) { setBusy(false); setStatus('녹음 파일을 처리하지 못했어요.\n(' + (e && e.message || e) + ')', 'err'); return; }
    debugInfo = '녹음 형식: ' + (rec.mimeType || recMime || '기본') + ' · 길이 ' + audio.sec.toFixed(1) + '초 · 원본 ' +
                Math.round(blob.size / 1024) + 'KB';
    organize([
      { text: '아래는 트레이너의 음성 메모입니다. 규칙대로 정리하세요.' },
      { inlineData: { mimeType: 'audio/wav', data: audio.b64 } }
    ]);
  }

  $('recBtn').onclick = function () {
    if (rec && rec.state === 'recording') stopRec(); else startRec();
  };

  // ── 글로 테스트 / 다시 정리 ──
  function organizeText(txt) {
    txt = String(txt || '').trim();
    if (!txt) { setStatus('내용을 먼저 적어 주세요.', 'err'); return; }
    if (!cfg('key')) { $('settingsBox').open = true; setStatus('먼저 [설정]에 API 키를 넣어 주세요.', 'err'); return; }
    setBusy(true);
    debugInfo = '글 입력 · ' + txt.length + '자';
    organize([{ text: '아래는 트레이너의 글 메모입니다. 규칙대로 정리하세요.\n\n' + txt }]);
  }
  $('textBtn').onclick = function () { organizeText($('textIn').value); };
  $('redoBtn').onclick = function () { organizeText($('transcript').value); };

  // ── AI 호출 ──
  var lastData = null, debugInfo = '';
  async function organize(parts) {
    setStatus('일지로 정리하는 중…', '', true);
    var t = Date.now();
    try {
      var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(cfg('model')) + ':generateContent';
      var r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg('key') },
        body: JSON.stringify(SJ.buildRequest(parts))
      });
      var body = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(SJ.friendlyError(r.status, body));
      var data = SJ.parseResponse(body);
      lastData = data;
      showResult(data);
      $('debug').textContent = debugInfo + ' · 정리 ' + ((Date.now() - t) / 1000).toFixed(1) + '초 · 모델 ' + cfg('model');
      setStatus('정리됐어요. 확인하고 공유해 주세요.', 'ok');
    } catch (e) {
      var m = e && e.message || String(e);
      if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = '인터넷 연결을 확인해 주세요. (' + m + ')';
      setStatus(m, 'err');
      $('debug').textContent = debugInfo;
      $('transBox').classList.remove('hidden');
    } finally {
      setBusy(false);
    }
  }

  function showResult(data) {
    $('result').value = SJ.render(data, { trainer: cfg('trainer'), center: cfg('center'), closing: cfg('closing') });
    $('transcript').value = data.transcript || '';
    $('resultBox').classList.remove('hidden');
    $('transBox').classList.remove('hidden');
    $('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── 복사 / 공유 ──
  async function copyText(txt) {
    try { await navigator.clipboard.writeText(txt); return true; }
    catch (e) {
      var ta = $('result'); ta.focus(); ta.select();
      try { return document.execCommand('copy'); } catch (e2) { return false; }
    }
  }
  $('copyBtn').onclick = async function () {
    setStatus((await copyText($('result').value)) ? '복사했어요. 카톡에 붙여넣으면 돼요.' : '복사가 안 됐어요. 글을 길게 눌러 직접 복사해 주세요.',
              'ok');
  };
  $('shareBtn').onclick = async function () {
    var txt = $('result').value;
    if (navigator.share) {
      try { await navigator.share({ text: txt }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    var ok = await copyText(txt);
    setStatus(ok ? '이 기기는 공유창을 지원하지 않아 복사해 뒀어요. 카톡에 붙여넣어 주세요.' : '복사가 안 됐어요. 글을 길게 눌러 직접 복사해 주세요.', ok ? 'ok' : 'err');
  };

  loadSettings();
})();
</script>
</body>
</html>
