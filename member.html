<script>window.SOWEL_APP = 'member';</script>
<script>
/* ───── 푸시 알림 공통 (Firebase 메시징 — 누를 때만 불러옴) ───── */
window.SOWEL_PUSH = (function () {
  var FB = 'https://www.gstatic.com/firebasejs/10.14.1/', loading = null;
  var ua = navigator.userAgent || '';
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function iosNeedsInstall() { return /iPhone|iPad|iPod/i.test(ua) && !standalone(); }
  function add(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src; s.async = true;
      s.onload = res; s.onerror = function () { rej(new Error('알림 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.')); };
      document.head.appendChild(s);
    });
  }
  function load() {
    if (window.firebase && window.firebase.messaging) return Promise.resolve();
    if (!loading) loading = add(FB + 'firebase-app-compat.js').then(function () { return add(FB + 'firebase-messaging-compat.js'); });
    return loading;
  }
  /** 알림 토큰 받기. ask=true면 허용 창을 띄움(버튼을 누른 순간에만 불러야 함) */
  function token(c, ask) {
    if (!supported()) return Promise.reject(new Error(iosNeedsInstall() ? '아이폰은 홈 화면에 추가한 앱에서만 알림을 받을 수 있어요.' : '이 브라우저는 알림을 지원하지 않아요.'));
    var perm = ask ? Notification.requestPermission() : Promise.resolve(Notification.permission);
    return Promise.resolve(perm).then(function (p) {
      if (p !== 'granted') {
        if (!ask) return '';
        throw new Error(p === 'denied' ? '알림이 꺼져 있어요. 폰 설정 → 알림에서 이 앱을 허용한 뒤 다시 눌러 주세요.' : '알림 허용을 눌러 주세요.');
      }
      return load().then(function () {
        if (!window.firebase.apps.length) window.firebase.initializeApp(c.config);
        return navigator.serviceWorker.register('sw.js');
      }).then(function (reg) {
        return navigator.serviceWorker.ready.then(function () {
          return window.firebase.messaging().getToken({ vapidKey: c.vapid, serviceWorkerRegistration: reg });
        });
      });
    });
  }
  function device() { return /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '기기'; }
  function granted() { return 'Notification' in window && Notification.permission === 'granted'; }
  return { supported: supported, iosNeedsInstall: iosNeedsInstall, token: token, device: device, granted: granted };
})();
</script>
<script>
/* ───── 앱처럼 쓰기: 홈 화면에 추가 안내 (이미 앱으로 열었으면 안 보임) ───── */
(function () {
  if ('serviceWorker' in navigator && !navigator.webdriver) navigator.serviceWorker.register('sw.js').catch(function () {});
  var KEY = 'sj_install_hide_' + (window.SOWEL_APP || 'app');
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var ua = navigator.userAgent || '';
  var kakao = /KAKAOTALK/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; show(); });
  function hidden() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function show() {
    var box = document.getElementById('installBox');
    if (!box || standalone || hidden()) return;
    var t = box.querySelector('.it'), b = box.querySelector('.ib');
    b.classList.add('hidden');
    if (kakao) {
      t.textContent = '카카오톡 안에서는 앱으로 저장할 수 없어요. 옆 버튼으로 연 다음 홈 화면에 추가해 주세요.';
      b.textContent = (ios ? 'Safari' : 'Chrome') + '로 열기'; b.classList.remove('hidden');
      b.onclick = function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); };
    } else if (deferred) {
      t.textContent = '홈 화면에 앱으로 설치하면 다음부터 아이콘을 눌러 바로 열 수 있어요.';
      b.textContent = '앱으로 설치'; b.classList.remove('hidden');
      b.onclick = function () { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; box.classList.add('hidden'); }); };
    } else if (ios) {
      t.innerHTML = '';
      t.appendChild(document.createTextNode('앱처럼 쓰려면 화면 아래 '));
      var s = document.createElement('b'); s.textContent = '공유 버튼(□↑)'; t.appendChild(s);
      t.appendChild(document.createTextNode(' → '));
      var s2 = document.createElement('b'); s2.textContent = '홈 화면에 추가'; t.appendChild(s2);
      t.appendChild(document.createTextNode('를 눌러 주세요.'));
    } else if (/Android/i.test(ua)) {
      t.textContent = '브라우저 메뉴(⋮)에서 "홈 화면에 추가" 또는 "앱 설치"를 누르면 앱처럼 쓸 수 있어요.';
    } else return;                                      // 컴퓨터에서는 안내 안 함
    box.classList.remove('hidden');
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.getElementById('installBox'); if (!box) return;
    box.querySelector('.ix').onclick = function () { box.classList.add('hidden'); try { localStorage.setItem(KEY, '1'); } catch (e) {} };
    show();
  });
})();
</script>

<script>
/* ───── 자동 업데이트: 올라온 파일의 버전이 다르면 같은 주소로 새로 열기 ───── */
var SOWEL_UPD = (function () {
  var me = (document.querySelector('meta[name="sowel-version"]') || {}).content || '';
  function fresh() {
    return fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { var m = /name="sowel-version" content="([^"]+)"/.exec(t); return m ? m[1] : ''; })
      .catch(function () { return ''; });
  }
  function reloadTo(v) {
    var u = new URL(location.href);
    if (u.searchParams.get('u') === v) return false;   // 이미 시도함 → 반복 방지
    u.searchParams.set('u', v);
    u.searchParams.delete('v');
    location.replace(u.toString());
    return true;
  }
  /** busy(): 지금 바꾸면 안 되는 상황이면 true → onWait(v) 호출 */
  function watch(busy, onWait) {
    var last = 0;
    function check() {
      if (Date.now() - last < 60000) return;
      last = Date.now();
      fresh().then(function (v) {
        if (!v || v === me) return;
        if (busy && busy()) { if (onWait) onWait(v); return; }
        reloadTo(v);
      });
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    window.addEventListener('focus', check);
  }
  return { version: me, watch: watch, reloadTo: reloadTo };
})();
</script>
<style>
  :root{
    --brown:#2C2620; --terra:#E8601A; --cream:#F5EFE6; --card:#FFFDF9;
    --line:#E6DCCD; --muted:#7D7166; --soft:#EFE6D8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--cream);color:var(--brown);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.65}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 56px}
  .brand{text-align:center}
  .mark{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;letter-spacing:.32em;padding-left:.32em;line-height:1}
  .center{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
  .hero{margin-top:28px;padding:22px 20px;border-radius:20px;background:var(--brown);color:var(--cream)}
  .eyebrow{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.24em;color:#E9B48F;margin:0}
  .hero h1{font-size:22px;margin:6px 0 0;font-weight:700;letter-spacing:-.3px}
  .stats{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:16px}
  .stat span{display:block;font-size:12px;color:#CBBFB0;margin-bottom:2px}
  .stat b{display:block;font-size:22px;font-weight:700;color:#fff;line-height:1.2}
  #validStat b{font-size:16px;line-height:1.5}
  #validStat b small{font-size:13px;font-weight:700;margin-left:2px}
  .state{white-space:pre-line;text-align:center;color:var(--muted);font-size:14px;padding:48px 8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--terra);
        border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sec{font-size:13px;font-weight:700;color:var(--muted);margin:28px 4px 10px;letter-spacing:.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
  .card.latest{border-color:var(--terra);box-shadow:0 6px 20px rgba(44,38,32,.06)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
  .date{font-weight:700;font-size:16px}
  .new{font-size:11px;font-weight:700;color:#fff;background:var(--terra);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
  .chip{font-size:12px;color:var(--muted);background:var(--soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
  .body{padding:0 16px 16px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15px}
  .latest .body{border-top:1px solid var(--soft);padding-top:14px}
  details.card>summary{list-style:none;cursor:pointer}
  details.card>summary::-webkit-details-marker{display:none}
  details.card .head{padding-bottom:4px}
  .preview{padding:0 16px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  details[open] .preview{display:none}
  details[open] .body{border-top:1px solid var(--soft);padding-top:14px}
  .tip{text-align:center;font-size:12px;color:var(--muted);margin-top:32px}
  .foot{text-align:center;font-family:'Cormorant Garamond',serif;letter-spacing:.2em;font-size:13px;color:var(--muted);margin-top:10px}
  .hidden{display:none !important}
  .pushcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
  .pushcard .pi{font-size:22px;flex:0 0 auto}
  .pushcard .pt{flex:1;min-width:0;font-size:14px;line-height:1.5}
  .pushcard .pt b{display:block;font-size:15px}
  .pushcard .pt span{color:var(--muted);font-size:12.5px}
  .pushcard button{flex:0 0 auto;border:0;background:var(--terra);color:#fff;border-radius:99px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
  .pushcard button:disabled{opacity:.5}
  .pushcard.on{padding:10px 16px}
  .pushcard.on button{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
  .pushmsg{font-size:12px;color:#B3261E;margin:6px 4px 0}
  .installbox{display:flex;gap:10px;align-items:center;background:#FFFDF9;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.5}
  .installbox img{width:36px;height:36px;border-radius:9px;flex:0 0 auto}
  .installbox .it{flex:1;min-width:0}
  .installbox .ib{flex:0 0 auto;border:0;background:var(--terra);color:#fff;border-radius:99px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .installbox .ix{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px}

  /* 다음 수업 */
  .next{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center}
  .dday{flex:0 0 auto;width:64px;height:64px;border-radius:16px;background:var(--terra);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .dday b{font-size:20px}
  .dday span{font-size:11px;opacity:.9}
  .next .info{min-width:0}
  .next .lbl{font-size:12px;color:var(--muted);font-weight:500}
  .next .when{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .next .who2{font-size:13px;color:var(--muted)}
  .next .more{font-size:12px;color:var(--muted);margin-top:4px}
  /* 부위별 기록 */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .pchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--brown);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
  .pchip b{font-weight:700;margin-left:4px;color:var(--terra)}
  .pchip.on{background:var(--brown);border-color:var(--brown);color:#fff}
  .pchip.on b{color:#E9B48F}
  .exlist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ex{border-top:1px solid var(--soft)}
  .ex:first-child{border-top:0}
  .ex>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
  .ex>summary::-webkit-details-marker{display:none}
  .ex .nm{font-weight:700;font-size:15px;flex:1;min-width:0}
  .ex .ct{font-size:12px;color:var(--muted);white-space:nowrap}
  .ex .last{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
  .ex .tag{font-size:11px;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:500;vertical-align:1px}
  .hist{padding:0 16px 12px;font-size:13px}
  .hist div{display:flex;gap:10px;padding:3px 0;border-top:1px dashed var(--soft)}
  .hist div:first-child{border-top:0}
  .hist span:first-child{color:var(--muted);flex:0 0 auto;width:62px}
  .stat.low b{color:#FF7A6E}
  /* 숙제 */
  .hw{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 6px}
  .hw .sub2{font-size:12px;color:var(--muted);margin:0 0 6px}
  .hwi{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--soft)}
  .hwi:first-of-type{border-top:0}
  .hwi .tx{flex:1;min-width:0;font-size:15px;word-break:keep-all;overflow-wrap:anywhere}
  .dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:9px;line-height:13px;text-align:center;color:var(--muted)}
  .dot.on{background:var(--terra);border-color:var(--terra);color:#fff}
  .dot.today{border-color:var(--brown)}
  .hwbtn{flex:0 0 auto;border:1.5px solid var(--terra);background:transparent;color:var(--terra);border-radius:99px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
  .hwbtn.on{background:var(--terra);color:#fff}
  .hwbtn:disabled{opacity:.6}
  .hwmsg{font-size:12px;color:#B3261E;min-height:0;padding-bottom:6px}
  /* 무게 변화 */
  .wbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px;position:relative}
  .wsum{font-size:13px;color:var(--muted);margin:2px 4px 6px}
  .wsum b{color:var(--brown)}
  .wbox svg{display:block;width:100%;height:auto;overflow:visible}
  .wtip{position:absolute;pointer-events:none;background:var(--brown);color:#fff;font-size:12px;border-radius:8px;padding:4px 8px;white-space:nowrap;transform:translate(-50%,-120%)}
</style>
</head>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function label(s) {
    var d = parseDate(s);
    return d ? (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')' : (s || '');
  }
  function shortDate(s) {
    var d = parseDate(s);
    return d ? String(d.getFullYear()).slice(2) + '.' + (d.getMonth() + 1) + '.' + d.getDate() : '-';
  }
  /** 저장된 일지 첫 줄(📋 오늘의 수업일지 · 날짜)은 카드 머리에 있으니 뺌 */
  function bodyText(t) {
    var lines = String(t || '').split('\n');
    if (lines[0] && lines[0].indexOf('📋') === 0) lines.shift();
    while (lines.length && !lines[0].trim()) lines.shift();
    return lines.join('\n');
  }
  function preview(t) {
    var lines = bodyText(t).split('\n');
    var ex = lines.filter(function (l) { return /^- /.test(l); }).map(function (l) { return l.slice(2).split(/\s\d/)[0]; });
    if (ex.length) return ex.slice(0, 4).join(' · ') + (ex.length > 4 ? ' 외 ' + (ex.length - 4) + '개' : '');
    for (var i = 0; i < lines.length; i++) if (lines[i].trim() && !/^[💪👍🏠➡📝🌿]/u.test(lines[i])) return lines[i];
    return '';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;

    body.action = 'pushMember'; body.c = code;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(readJson).then(function (j) { if (!j.ok) throw new Error(j.error || '처리하지 못했어요.'); return j; });
  }
  function renderPush(cfg) {
    PUSH = cfg;
    var card = $('pushCard');
    if (!cfg || (!SOWEL_PUSH.supported() && !SOWEL_PUSH.iosNeedsInstall())) { card.classList.add('hidden'); return; }
    var on = SOWEL_PUSH.granted() && !!pget(), b = $('pushBtn'), t = $('pushText');
    card.classList.toggle('on', on);
    t.innerHTML = '';
    if (on) {
      t.appendChild(document.createTextNode('수업 알림이 켜져 있어요'));
      b.textContent = '끄기'; b.disabled = false;
      b.onclick = function () { b.disabled = true; pushApi({ off: true, pt: pget() }).then(function () { pset(''); pmsg(''); renderPush(PUSH); }).catch(function (e) { b.disabled = false; pmsg(e.message); }); };
    } else {
      t.appendChild(el('b', '', '수업 알림 받기'));
      t.appendChild(el('span', '', SOWEL_PUSH.iosNeedsInstall() ? '아이폰은 홈 화면에 추가한 앱에서 켤 수 있어요 (공유 → 홈 화면에 추가)'
                                                               : '수업 전날·1시간 전, 새 수업일지가 올라오면 알려 드려요'));
      b.textContent = '알림 받기'; b.disabled = SOWEL_PUSH.iosNeedsInstall();
      b.onclick = function () {
        b.disabled = true; pmsg('');
        SOWEL_PUSH.token(PUSH, true).then(function (tk) {
          if (!tk) throw new Error('알림 등록에 실패했어요. 잠시 후 다시 눌러 주세요.');
          return pushApi({ pt: tk, device: SOWEL_PUSH.device() }).then(function () { pset(tk); });
        }).then(function () { renderPush(PUSH); })
          .catch(function (e) { b.disabled = false; pmsg(e.message); });
      };
    }
    card.classList.remove('hidden');
    // 이미 켜져 있으면 조용히 등록 정보 새로 고침
    if (on) SOWEL_PUSH.token(cfg, false).then(function (tk) { if (tk && tk !== pget()) return pushApi({ pt: tk, device: SOWEL_PUSH.device() }).then(function () { pset(tk); }); }).catch(function () {});
  }

  function fail(msg) {
    $('state').textContent = msg;
  }

  SOWEL_UPD.watch(null, null);
  var code = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
  var API = window.SOWEL_API;
  if (!code) return fail('링크가 올바르지 않아요. 센터에서 받은 링크로 다시 열어 주세요.');
  if (!API || !/^https:\/\//.test(API)) return fail('아직 준비 중인 페이지예요. 센터에 문의해 주세요.');

  /** 응답을 JSON으로 읽고, 아니면 무엇이 왔는지 남김 */
  function readJson(r) {
    return r.text().then(function (t) {
      try { return JSON.parse(t); }
      catch (e) {
        var hint = /<title>([^<]*)/i.exec(t);
        throw new Error('응답 형식 오류 ' + r.status + (hint ? ' · ' + hint[1].trim() : '') + ' · ' + t.slice(0, 60).replace(/\s+/g, ' '));
      }
    });
  }
  function viaGet() {
    return fetch(API + '?action=member&c=' + encodeURIComponent(code)).then(readJson);
  }
  function viaPost() {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'member', c: code }) }).then(readJson);
  }
  function load() {
    var why = [];
    return viaGet().then(function (j) {
      if (j && j.ok === false && /알 수 없는 요청/.test(j.error || '')) throw new Error(j.error);
      return j;
    }).catch(function (e) {
      why.push('GET: ' + (e && e.message || e));
      return viaPost().then(function (j) {
        if (j && j.ok === false && /알 수 없는 요청/.test(j.error || '')) throw new Error('시트 코드가 예전 버전이에요 (' + j.error + ')');
        return j;
      });
    }).catch(function (e) {
      why.push('POST: ' + (e && e.message || e));
      var err = new Error('load'); err.why = why; throw err;
    });
  }
  function showWhy(lines) {
    var d = el('div', '', lines.join('\n'));
    d.style.cssText = 'font-size:11px;color:#9A8E82;margin-top:12px;white-space:pre-wrap;word-break:break-all;text-align:left';
    $('state').appendChild(d);
  }

  load()
    .then(function (j) {
      try { render(j); }
      catch (e) { fail('화면을 그리다가 문제가 생겼어요. 센터에 이 화면을 보여 주세요.'); showWhy(['화면 오류: ' + (e && e.message || e)]); }
    })
    .catch(function (e) {
      fail('수업일지를 불러오지 못했어요. 잠시 후 다시 열어 주세요.');
      showWhy(e && e.why ? e.why : [String(e && e.message || e)]);
    });

  function render(j) {
      if (!j.ok) return fail(j.error || '수업일지를 불러오지 못했어요.');
      document.title = j.name + '님의 수업일지 · SOWEL';
      if (j.center) $('center').textContent = j.center;
      $('title').textContent = j.name + '님의 수업일지';
      $('count').textContent = j.count;
      if (j.trainer) { $('trainer').textContent = j.trainer; $('trainerStat').classList.remove('hidden'); }
      var logs = j.logs || [];
      $('since').textContent = logs.length ? shortDate(logs[logs.length - 1].date) : '-';
      $('hero').classList.remove('hidden');
      renderNext(j.next);
      renderLeft(j.sessions);
      renderValid(j.valid);
      renderPush(j.push);
      renderHw(j.hw);

      if (!logs.length) return fail('아직 기록된 수업일지가 없어요.\n첫 수업 후에 이곳에 쌓여요 🌿');
      $('state').classList.add('hidden');

      var list = $('list');
      var weekAgo = Date.now() - 3 * 86400000;
      var first = logs[0];
      list.appendChild(el('div', 'sec', '가장 최근 수업'));
      var c = el('article', 'card latest');
      var fd = parseDate(first.date);
      c.appendChild(head(first, fd && fd.getTime() >= weekAgo));
      c.appendChild(el('div', 'body', bodyText(first.text)));
      list.appendChild(c);

      renderWeights(list, logs);
      renderParts(list, logs);

      if (logs.length > 1) {
        list.appendChild(el('div', 'sec', '지난 수업 (' + (logs.length - 1) + ')'));
        logs.slice(1).forEach(function (log) {
          var d = el('details', 'card');
          var s = el('summary');
          s.appendChild(head(log, false));
          var pv = preview(log.text);
          if (pv) s.appendChild(el('div', 'preview', pv));
          d.appendChild(s);
          d.appendChild(el('div', 'body', bodyText(log.text)));
          list.appendChild(d);
        });
      }
  }
})();
</script>
</body>
</html>
