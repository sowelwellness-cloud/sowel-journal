<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
/* ───── 자동 업데이트: 올라온 파일의 버전이 다르면 같은 주소로 새로 열기 ───── */
var SOWEL_UPD = (function () {
  var me = (document.querySelector('meta[name="sowel-version"]') || {}).content || '';
  function fresh() {
    return fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) { var m = /name="sowel-version" content="([^"]+)"/.exec(t); return m ? m[1] : ''; })
      .catch(function () { return ''; });
  }
  function reloadTo(v) {
    var u = new URL(location.href);
    if (u.searchParams.get('u') === v) return false;   // 이미 시도함 → 반복 방지
    u.searchParams.set('u', v);
    u.searchParams.delete('v');
    location.replace(u.toString());
    return true;
  }
  /** busy(): 지금 바꾸면 안 되는 상황이면 true → onWait(v) 호출 */
  function watch(busy, onWait) {
    var last = 0;
    function check() {
      if (Date.now() - last < 60000) return;
      last = Date.now();
      fresh().then(function (v) {
        if (!v || v === me) return;
        if (busy && busy()) { if (onWait) onWait(v); return; }
        reloadTo(v);
      });
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    window.addEventListener('focus', check);
  }
  return { version: me, watch: watch, reloadTo: reloadTo };
})();
</script>
<style>
  :root{
    --brown:#2C2620; --terra:#E8601A; --cream:#F5EFE6; --card:#FFFDF9;
    --line:#E6DCCD; --muted:#7D7166; --soft:#EFE6D8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--cream);color:var(--brown);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.65}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 56px}
  .brand{text-align:center}
  .mark{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;letter-spacing:.32em;padding-left:.32em;line-height:1}
  .center{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:6px}
  .hero{margin-top:28px;padding:22px 20px;border-radius:20px;background:var(--brown);color:var(--cream)}
  .eyebrow{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.24em;color:#E9B48F;margin:0}
  .hero h1{font-size:22px;margin:6px 0 0;font-weight:700;letter-spacing:-.3px}
  .stats{display:flex;gap:18px;margin-top:16px}
  .stat b{display:block;font-size:22px;font-weight:700;color:#fff;line-height:1.2}
  .stat span{font-size:12px;color:#CBBFB0}
  .state{white-space:pre-line;text-align:center;color:var(--muted);font-size:14px;padding:48px 8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--terra);
        border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sec{font-size:13px;font-weight:700;color:var(--muted);margin:28px 4px 10px;letter-spacing:.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
  .card.latest{border-color:var(--terra);box-shadow:0 6px 20px rgba(44,38,32,.06)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
  .date{font-weight:700;font-size:16px}
  .new{font-size:11px;font-weight:700;color:#fff;background:var(--terra);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
  .chip{font-size:12px;color:var(--muted);background:var(--soft);border-radius:99px;padding:3px 10px;white-space:nowrap}
  .body{padding:0 16px 16px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15px}
  .latest .body{border-top:1px solid var(--soft);padding-top:14px}
  details.card>summary{list-style:none;cursor:pointer}
  details.card>summary::-webkit-details-marker{display:none}
  details.card .head{padding-bottom:4px}
  .preview{padding:0 16px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  details[open] .preview{display:none}
  details[open] .body{border-top:1px solid var(--soft);padding-top:14px}
  .tip{text-align:center;font-size:12px;color:var(--muted);margin-top:32px}
  .foot{text-align:center;font-family:'Cormorant Garamond',serif;letter-spacing:.2em;font-size:13px;color:var(--muted);margin-top:10px}
  .hidden{display:none !important}
  /* 다음 수업 */
  .next{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center}
  .dday{flex:0 0 auto;width:64px;height:64px;border-radius:16px;background:var(--terra);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .dday b{font-size:20px}
  .dday span{font-size:11px;opacity:.9}
  .next .info{min-width:0}
  .next .lbl{font-size:12px;color:var(--muted);font-weight:500}
  .next .when{font-size:18px;font-weight:700;letter-spacing:-.2px}
  .next .who2{font-size:13px;color:var(--muted)}
  .next .more{font-size:12px;color:var(--muted);margin-top:4px}
  /* 부위별 기록 */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .pchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--brown);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
  .pchip b{font-weight:700;margin-left:4px;color:var(--terra)}
  .pchip.on{background:var(--brown);border-color:var(--brown);color:#fff}
  .pchip.on b{color:#E9B48F}
  .exlist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ex{border-top:1px solid var(--soft)}
  .ex:first-child{border-top:0}
  .ex>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
  .ex>summary::-webkit-details-marker{display:none}
  .ex .nm{font-weight:700;font-size:15px;flex:1;min-width:0}
  .ex .ct{font-size:12px;color:var(--muted);white-space:nowrap}
  .ex .last{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
  .ex .tag{font-size:11px;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:500;vertical-align:1px}
  .hist{padding:0 16px 12px;font-size:13px}
  .hist div{display:flex;gap:10px;padding:3px 0;border-top:1px dashed var(--soft)}
  .hist div:first-child{border-top:0}
  .hist span:first-child{color:var(--muted);flex:0 0 auto;width:62px}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <div class="mark">SOWEL</div>
    <div class="center" id="center">WELLNESS PT</div>
  </div>

  <section class="hero hidden" id="hero">
    <p class="eyebrow">MY SESSION LOG</p>
    <h1 id="title">나의 수업일지</h1>
    <div class="stats">
      <div class="stat"><b id="count">0</b><span>기록된 수업</span></div>
      <div class="stat"><b id="since">-</b><span>첫 기록</span></div>
      <div class="stat hidden" id="trainerStat"><b id="trainer">-</b><span>담당 선생님</span></div>
    </div>
  </section>

  <section class="next hidden" id="next">
    <div class="dday" id="dday"><b>D-1</b><span>다음 수업</span></div>
    <div class="info">
      <div class="lbl">다음 수업</div>
      <div class="when" id="nextWhen"></div>
      <div class="who2" id="nextWho"></div>
      <div class="more" id="nextMore"></div>
    </div>
  </section>

  <div class="state" id="state"><span class="spin"></span>수업일지를 불러오는 중이에요…</div>
  <div id="list"></div>

  <p class="tip hidden" id="tip">이 페이지를 홈 화면에 추가해 두면 앱처럼 바로 열 수 있어요.</p>
  <div class="foot">SOWEL WELLNESS</div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function parseDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function label(s) {
    var d = parseDate(s);
    return d ? (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')' : (s || '');
  }
  function shortDate(s) {
    var d = parseDate(s);
    return d ? String(d.getFullYear()).slice(2) + '.' + (d.getMonth() + 1) + '.' + d.getDate() : '-';
  }
  /** 저장된 일지 첫 줄(📋 오늘의 수업일지 · 날짜)은 카드 머리에 있으니 뺌 */
  function bodyText(t) {
    var lines = String(t || '').split('\n');
    if (lines[0] && lines[0].indexOf('📋') === 0) lines.shift();
    while (lines.length && !lines[0].trim()) lines.shift();
    return lines.join('\n');
  }
  function preview(t) {
    var lines = bodyText(t).split('\n');
    var ex = lines.filter(function (l) { return /^- /.test(l); }).map(function (l) { return l.slice(2).split(/\s\d/)[0]; });
    if (ex.length) return ex.slice(0, 4).join(' · ') + (ex.length > 4 ? ' 외 ' + (ex.length - 4) + '개' : '');
    for (var i = 0; i < lines.length; i++) if (lines[i].trim() && !/^[💪👍🏠➡📝🌿]/u.test(lines[i])) return lines[i];
    return '';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function head(log, isNew) {
    var h = el('div', 'head');
    var d = el('div', 'date', label(log.date));
    if (isNew) d.appendChild(el('span', 'new', 'NEW'));
    h.appendChild(d);
    if (log.trainer) h.appendChild(el('span', 'chip', log.trainer + ' 선생님'));
    return h;
  }
  // ───── 다음 수업 ─────
  function hm(d) {
    var h = d.getHours(), m = d.getMinutes();
    return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + ('0' + m).slice(-2);
  }
  function md(d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DAYS[d.getDay()] + ')'; }
  /** 일정 탭 형식 {date:'2026-11-03', start:'19:00', min:50} → 시작·끝 시각 */
  function toTimes(n) {
    var d = parseDate(n.date); if (!d) return null;
    var p = String(n.start || '').split(':');
    var a = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +p[0] || 0, +p[1] || 0);
    return { a: a, z: new Date(a.getTime() + (Number(n.min) || 60) * 60000), trainer: n.trainer };
  }
  function renderNext(next) {
    next = (next || []).map(toTimes).filter(function (n) { return n && n.z.getTime() > Date.now(); });
    if (!next.length) return;
    var a = next[0].a, z = next[0].z;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var day0 = new Date(a); day0.setHours(0, 0, 0, 0);
    var diff = Math.round((day0 - today) / 86400000);
    $('dday').innerHTML = '';
    $('dday').appendChild(el('b', '', diff <= 0 ? '오늘' : diff === 1 ? '내일' : 'D-' + diff));
    $('dday').appendChild(el('span', '', a.getHours() < 12 ? '오전' : '오후'));
    $('nextWhen').textContent = md(a) + ' ' + hm(a) + ' – ' + hm(z).replace(/^오[전후] /, '');
    $('nextWho').textContent = next[0].trainer ? next[0].trainer + ' 선생님' : '';
    $('nextMore').textContent = next.length > 1 ? '그다음: ' + next.slice(1).map(function (n) {
      var d = n.a; return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DAYS[d.getDay()] + ') ' + hm(d);
    }).join(' · ') : '';
    $('next').classList.remove('hidden');
  }

  // ───── 부위별 운동 기록 ─────
  var PARTS = ['하체', '가슴', '등', '어깨', '팔', '코어', '전신', '유산소', '가동성·스트레칭', '기타'];
  /** 예전 일지(부위 정보 없음)는 운동 이름으로 부위 추정 */
  var GUESS = [
    ['하체', /레그\s?컬|레그\s?익스텐션|햄스트링\s?컬|노르딕|힙\s?쓰러스트|힙\s?어브덕|힙\s?어덕/],
    ['가동성·스트레칭', /스트레칭|오픈북|폼\s?롤|가동성|모빌리티|요가|캣\s?카우|월\s?슬라이드|90.?90|흉추|햄스트링\s?스트레칭/],
    ['유산소', /러닝|런닝|트레드밀|사이클|자전거|로잉|일립티컬|스텝밀|줄넘기|걷기|인터벌/],
    ['코어', /플랭크|데드\s?버그|크런치|버드\s?독|싯업|레그\s?레이즈|할로우|팔로프|러시안|복근|코어|사이드\s?브릿지/],
    ['전신', /버피|스윙|클린|스내치|스러스터|터키시|파머스|캐리|마운틴\s?클라이머/],
    ['어깨', /숄더|레터럴|프론트\s?레이즈|페이스\s?풀|밀리터리|오버헤드\s?프레스|아놀드|리어\s?델트/],
    ['팔', /컬|트라이셉|삼두|이두|킥백|딥스|해머/],
    ['가슴', /벤치|푸시\s?업|푸쉬\s?업|체스트|플라이|펙덱|가슴/],
    ['등', /풀\s?업|친\s?업|랫\s?풀|로우|풀\s?다운|백\s?익스텐션|등/],
    ['하체', /스쿼트|런지|데드|힙|브릿지|레그|카프|스텝\s?업|굿모닝|글루트|하체|스플릿|쓰러스트|와이드|고블릿|박스\s?점프/]
  ];
  function guessPart(name) {
    for (var i = 0; i < GUESS.length; i++) if (GUESS[i][1].test(name)) return GUESS[i][0];
    return '기타';
  }
  /** 일지 글의 '💪 오늘 한 운동'에서 운동 줄을 뽑음 ([부위] 묶음이 있으면 그대로 씀) */
  function exFromText(t) {
    var out = [], inEx = false, part = '';
    String(t || '').split('\n').forEach(function (l) {
      l = l.trim();
      if (/^💪/u.test(l)) { inEx = true; return; }
      if (!inEx) return;
      if (/^[👍🏠➡📝🌿]/u.test(l)) { inEx = false; return; }
      var hd = /^\[(.+)\]$/.exec(l);
      if (hd) { part = PARTS.indexOf(hd[1]) >= 0 ? hd[1] : ''; return; }
      if (!/^- /.test(l)) return;
      l = l.slice(2).trim();
      var m = /^(.*?)\s+((?:\d|약|맨몸|양쪽|한쪽|좌우).*)$/.exec(l);
      var n = (m ? m[1] : l).trim(), d = m ? m[2].trim() : '';
      if (n) out.push({ n: n, d: d, p: part || guessPart(n) });
    });
    return out;
  }
  function buildParts(logs) {
    var parts = {};
    logs.slice().reverse().forEach(function (log) {          // 오래된 것부터
      var ex = (log.ex && log.ex.length) ? log.ex : exFromText(log.text);
      ex.forEach(function (e) {
        var p = PARTS.indexOf(e.p) >= 0 ? e.p : '기타';
        var key = String(e.n).replace(/\s+/g, '');
        var P = parts[p] || (parts[p] = { name: p, items: {}, count: 0 });
        var it = P.items[key] || (P.items[key] = { name: e.n, hist: [] });
        it.name = e.n;
        it.hist.unshift({ date: log.date, d: e.d || '' });   // 최신이 앞
        P.count++;
      });
    });
    return Object.keys(parts).map(function (k) {
      var P = parts[k];
      P.list = Object.keys(P.items).map(function (x) { return P.items[x]; })
        .sort(function (a, b) { return a.hist[0].date < b.hist[0].date ? 1 : a.hist[0].date > b.hist[0].date ? -1 : b.hist.length - a.hist.length; });
      return P;
    }).sort(function (a, b) { return b.count - a.count || PARTS.indexOf(a.name) - PARTS.indexOf(b.name); });
  }
  function md2(s) { var d = parseDate(s); return d ? (d.getMonth() + 1) + '/' + d.getDate() : s; }
  function renderParts(container, logs) {
    var parts = buildParts(logs);
    if (!parts.length) return;
    container.appendChild(el('div', 'sec', '부위별 운동 기록'));
    var chips = el('div', 'chips'); container.appendChild(chips);
    var box = el('div', 'exlist'); container.appendChild(box);
    var total = parts.reduce(function (s2, P) { return s2 + P.list.length; }, 0);
    function show(sel) {
      Array.prototype.forEach.call(chips.children, function (c) { c.classList.toggle('on', c.dataset.p === sel); });
      box.innerHTML = '';
      var items = [];
      parts.forEach(function (P) { if (sel === '' || P.name === sel) P.list.forEach(function (it) { items.push({ it: it, part: P.name }); }); });
      if (sel === '') items.sort(function (a, b) { return a.it.hist[0].date < b.it.hist[0].date ? 1 : a.it.hist[0].date > b.it.hist[0].date ? -1 : 0; });
      items.forEach(function (x) {
        var it = x.it, row = el('details', 'ex');
        var sm = el('summary');
        var nm = el('div', 'nm', it.name);
        if (sel === '') nm.appendChild(el('span', 'tag', x.part));
        nm.appendChild(el('span', 'last', '최근 ' + md2(it.hist[0].date) + (it.hist[0].d ? ' · ' + it.hist[0].d : '')));
        sm.appendChild(nm);
        sm.appendChild(el('span', 'ct', it.hist.length + '회'));
        row.appendChild(sm);
        var h = el('div', 'hist');
        it.hist.slice(0, 10).forEach(function (r) {
          var line = el('div'); line.appendChild(el('span', '', md2(r.date))); line.appendChild(el('span', '', r.d || '기록 없음')); h.appendChild(line);
        });
        if (it.hist.length > 10) h.appendChild(el('div', '', '… 외 ' + (it.hist.length - 10) + '번'));
        row.appendChild(h);
        box.appendChild(row);
      });
    }
    var all = el('button', 'pchip', '전체'); all.dataset.p = ''; all.appendChild(el('b', '', String(total))); chips.appendChild(all);
    all.onclick = function () { show(''); };
    parts.forEach(function (P) {
      var c = el('button', 'pchip', P.name); c.dataset.p = P.name; c.appendChild(el('b', '', String(P.list.length)));
      c.onclick = function () { show(P.name); };
      chips.appendChild(c);
    });
    show(parts[0].name);
  }

  function fail(msg) {
    $('state').textContent = msg;
  }

  SOWEL_UPD.watch(null, null);
  var code = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
  var API = window.SOWEL_API;
  if (!code) return fail('링크가 올바르지 않아요. 센터에서 받은 링크로 다시 열어 주세요.');
  if (!API || !/^https:\/\//.test(API)) return fail('아직 준비 중인 페이지예요. 센터에 문의해 주세요.');

  /** 응답을 JSON으로 읽고, 아니면 무엇이 왔는지 남김 */
  function readJson(r) {
    return r.text().then(function (t) {
      try { return JSON.parse(t); }
      catch (e) {
        var hint = /<title>([^<]*)/i.exec(t);
        throw new Error('응답 형식 오류 ' + r.status + (hint ? ' · ' + hint[1].trim() : '') + ' · ' + t.slice(0, 60).replace(/\s+/g, ' '));
      }
    });
  }
  function viaGet() {
    return fetch(API + '?action=member&c=' + encodeURIComponent(code)).then(readJson);
  }
  function viaPost() {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'member', c: code }) }).then(readJson);
  }
  function load() {
    var why = [];
    return viaGet().then(function (j) {
      if (j && j.ok === false && /알 수 없는 요청/.test(j.error || '')) throw new Error(j.error);
      return j;
    }).catch(function (e) {
      why.push('GET: ' + (e && e.message || e));
      return viaPost().then(function (j) {
        if (j && j.ok === false && /알 수 없는 요청/.test(j.error || '')) throw new Error('시트 코드가 예전 버전이에요 (' + j.error + ')');
        return j;
      });
    }).catch(function (e) {
      why.push('POST: ' + (e && e.message || e));
      var err = new Error('load'); err.why = why; throw err;
    });
  }
  function showWhy(lines) {
    var d = el('div', '', lines.join('\n'));
    d.style.cssText = 'font-size:11px;color:#9A8E82;margin-top:12px;white-space:pre-wrap;word-break:break-all;text-align:left';
    $('state').appendChild(d);
  }

  load()
    .then(function (j) {
      try { render(j); }
      catch (e) { fail('화면을 그리다가 문제가 생겼어요. 센터에 이 화면을 보여 주세요.'); showWhy(['화면 오류: ' + (e && e.message || e)]); }
    })
    .catch(function (e) {
      fail('수업일지를 불러오지 못했어요. 잠시 후 다시 열어 주세요.');
      showWhy(e && e.why ? e.why : [String(e && e.message || e)]);
    });

  function render(j) {
      if (!j.ok) return fail(j.error || '수업일지를 불러오지 못했어요.');
      document.title = j.name + '님의 수업일지 · SOWEL';
      if (j.center) $('center').textContent = j.center;
      $('title').textContent = j.name + '님의 수업일지';
      $('count').textContent = j.count;
      if (j.trainer) { $('trainer').textContent = j.trainer; $('trainerStat').classList.remove('hidden'); }
      var logs = j.logs || [];
      $('since').textContent = logs.length ? shortDate(logs[logs.length - 1].date) : '-';
      $('hero').classList.remove('hidden');
      $('tip').classList.remove('hidden');
      renderNext(j.next);

      if (!logs.length) return fail('아직 기록된 수업일지가 없어요.\n첫 수업 후에 이곳에 쌓여요 🌿');
      $('state').classList.add('hidden');

      var list = $('list');
      var weekAgo = Date.now() - 3 * 86400000;
      var first = logs[0];
      list.appendChild(el('div', 'sec', '가장 최근 수업'));
      var c = el('article', 'card latest');
      var fd = parseDate(first.date);
      c.appendChild(head(first, fd && fd.getTime() >= weekAgo));
      c.appendChild(el('div', 'body', bodyText(first.text)));
      list.appendChild(c);

      renderParts(list, logs);

      if (logs.length > 1) {
        list.appendChild(el('div', 'sec', '지난 수업 (' + (logs.length - 1) + ')'));
        logs.slice(1).forEach(function (log) {
          var d = el('details', 'card');
          var s = el('summary');
          s.appendChild(head(log, false));
          var pv = preview(log.text);
          if (pv) s.appendChild(el('div', 'preview', pv));
          d.appendChild(s);
          d.appendChild(el('div', 'body', bodyText(log.text)));
          list.appendChild(d);
        });
      }
  }
})();
</script>
</body>
</html>
